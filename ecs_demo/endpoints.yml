# -*- coding: utf-8 -*-
# 端点配置文件
#
# 所有可变项都走环境变量，默认值 = 原配置 —— 换机器 / 换模型不用改源码。
#   LLM_TYPE      默认 qwen（通义），可切 openai（任何 OpenAI 兼容服务）
#   LLM_MODEL     默认 qwen-plus
#   LLM_API_BASE  仅 openai 类型需要，例如 http://127.0.0.1:8788/v1
#   DASHSCOPE_API_KEY  API Key（openai 类型下即普通 bearer key）

# LLM模型配置
models:
  default:
    type: ${LLM_TYPE:qwen}
    model: ${LLM_MODEL:qwen-plus}
    api_key: ${DASHSCOPE_API_KEY:}
    api_base: ${LLM_API_BASE:}
    temperature: 0.1

# 向量存储配置 (Neo4j)
vector_store:
  uri: bolt://localhost:7687
  user: neo4j
  password: ${NEO4J_PASSWORD:}

# 数据库配置 (MySQL)
database:
  url: mysql+pymysql://root:${MYSQL_PASSWORD:}@localhost:3306/ecommerce

# Tracker存储配置
tracker_store:
  type: memory

# NLG配置
nlg:
  rephrase_enabled: false
